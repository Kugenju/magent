name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (offline-first, dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Full test suite
        run: python -m pytest -q

      - name: Show tool versions
        run: |
          python --version
          mypy --version
          pip freeze

      - name: Type check
        run: mypy src/magent

      - name: No generated artifacts are tracked
        run: |
          if git ls-files --error-unmatch -- '*.db' '*.jsonl' 'benchmarks/out/*'; then
            echo "::error::tracked generated artifacts detected"; exit 1
          fi

      - name: Offline smoke tests
        run: |
          python examples/producer_consumer.py
          python examples/checkpoint_resume.py
          python examples/phase6_tools_llm_middleware.py
          python -m examples.vulntell --no-llm --json
          python -m examples.vulntell --trace benchmarks/out/vulntell
          python -m benchmarks.cli --out benchmarks/out

      - name: Working tree clean after smoke tests
        run: |
          git status --porcelain benchmarks/out || true
          # benchmarks/out is git-ignored; fail if anything else is unexpectedly modified
          if [ -n "$(git status --porcelain | grep -v '^?? benchmarks/out')" ]; then
            echo "::error::unexpected working-tree changes"; git status --porcelain; exit 1
          fi
