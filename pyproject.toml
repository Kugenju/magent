[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "magent"
version = "0.1.0"
description = "Minimal, reusable, recoverable multi-agent execution framework (phases 1-8: kernel, graph, concurrency, reliability, checkpoint/recovery, tools/LLM/middleware, and offline observability & evaluation)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["pydantic>=2.5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.23,<2", "mypy>=1.14,<1.15"]
# L2/L3 network-capable extras (see docs/architecture/NETWORK_POLICY.md):
# the core runtime dependency set stays pydantic-only; these are opt-in.
mcp = ["mcp>=1.10,<2"]   # official MCP Python SDK (v1; transport seam isolates future v2)
net = ["httpx>=0.27,<1"] # HTTP transport used by live source adapters / future live features

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
  "live: real-network / real-process tests (opt-in via MAGENT_RUN_LIVE=1; excluded from the offline CI gate)",
]
